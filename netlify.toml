# Netlify: the web app lives in /web (Next.js, detected by Netlify's Next.js runtime).
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime (server functions, middleware, static assets). Declared explicitly so Git builds use it.
[[plugins]]
  package = "@netlify/plugin-nextjs"
