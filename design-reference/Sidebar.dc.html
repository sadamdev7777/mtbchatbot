<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main menu" style="width: 240px; min-height: 900px; height: 100%; box-sizing: border-box; background: #0B2B26; color: #CFE7E1; font-family: Inter, system-ui, sans-serif; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #25D366; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B2B26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.9A8 8 0 1 1 21 12z"></path></svg>
    </div>
    <div>
      <div style="font-size: 15px; font-weight: 700; color: #FFFFFF">MTB Inbox</div>
      <div style="font-size: 12px; color: #A9CFC6">Muslimtravelbug</div>
    </div>
  </div>
  <sc-for list="{{items}}" as="item" hint-placeholder-count="18">
    <sc-if value="{{item.isHeader}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8FB8AE; padding: 16px 12px 6px">{{item.label}}</div>
    </sc-if>
    <sc-if value="{{item.on}}" hint-placeholder-val="{{false}}">
      <a href="{{item.href}}" aria-current="page" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; background: #134E45; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">
        <span>{{item.label}}</span>
        <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; height: 20px; border-radius: 10px; background: #25D366; color: #0B2B26; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px">{{item.badge}}</span></sc-if>
      </a>
    </sc-if>
    <sc-if value="{{item.off}}" hint-placeholder-val="{{true}}">
      <a href="{{item.href}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; color: #CFE7E1; font-size: 14px; font-weight: 500; text-decoration: none">
        <span>{{item.label}}</span>
        <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; height: 20px; border-radius: 10px; background: #F79009; color: #1D1302; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px">{{item.badge}}</span></sc-if>
      </a>
    </sc-if>
  </sc-for>
  <div style="margin-top: auto; padding-top: 20px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: #123A33">
      <div style="width: 36px; height: 36px; border-radius: 18px; background: #E6F4F0; color: #0B2B26; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">SI</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">Sadam</div>
        <div style="font-size: 12px; color: #A9CFC6">Owner · Online</div>
      </div>
      <a href="Main.dc.html" aria-label="Log out" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #CFE7E1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </a>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":null,"default":"inbox"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const alias = { laporan: 'dashboard', template: 'broadcast', knowledge: 'ai', uji: 'ai', malam: 'audit', automasi: 'tetapan', staf: 'tetapan', saluran: 'tetapan', notif: 'tetapan', integrasi: 'tetapan' };
    const p = this.props.active ?? 'inbox';
    const a = alias[p] || p;
    const raw = [
      { key: 'dashboard', label: 'Dashboard', href: 'Dashboard.dc.html' },
      { key: 'inbox', label: 'Inbox', href: 'Inbox.dc.html', badge: '9' },
      { key: 'kontak', label: 'Contacts', href: 'Kontak.dc.html' },
      { key: 'broadcast', label: 'Broadcast', href: 'Broadcast.dc.html' },
      { isHeader: true, label: 'AI' },
      { key: 'ai', label: 'AI Team', href: 'AIAgent.dc.html' },
      { key: 'audit', label: 'Morning report', href: 'Audit.dc.html', badge: '4' },
      { isHeader: true, label: 'Admin' },
      { key: 'bayaran', label: 'Payment verification', href: 'PengesahanBayaran.dc.html', badge: '3' },
      { key: 'tetapan', label: 'Settings', href: 'SettingsStaf.dc.html' }
    ];
    return {
      items: raw.map((it) => ({
        ...it,
        isHeader: !!it.isHeader,
        on: !it.isHeader && it.key === a,
        off: !it.isHeader && it.key !== a,
        hasBadge: !!it.badge
      }))
    };
  }
}
</script>
</body>
</html>
